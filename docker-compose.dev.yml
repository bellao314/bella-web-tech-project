name: mobile-vendor-app-dev

services:
  db:
    image: postgres:16-alpine
    container_name: mobile_vendor_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-mobile_vendor}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mobile_vendor}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-dev-network

  api:
    container_name: mobile_vendor_api_dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "npx prisma db migrate --yes && npm --prefix api run dev"
    volumes:
      - ./api:/app/api
      - /app/node_modules
      - /app/api/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-mobile_vendor}
      JWT_SECRET: ${JWT_SECRET:-mobile_vendor_super_secret_jwt_key_2026}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      POSTMARK_API_TOKEN: ${POSTMARK_API_TOKEN:-}
      BASE_URL: ${BASE_URL:-http://localhost:5173}
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: ${SEED_DATABASE:-false}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-dev-network

  frontend:
    container_name: mobile_vendor_frontend_dev
    image: node:24-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
      VITE_API_URL: /api
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-dev-network

volumes:
  postgres_data_dev:
    driver: local

networks:
  app-dev-network:
    driver: bridge
