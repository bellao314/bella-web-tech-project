name: mobile-vendor-app

services:
  db:
    image: postgres:16-alpine
    container_name: mobile_vendor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-mobile_vendor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mobile_vendor}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  api:
    container_name: mobile_vendor_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-mobile_vendor}
      JWT_SECRET: ${JWT_SECRET:-mobile_vendor_super_secret_jwt_key_2026}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      BASE_URL: ${BASE_URL:-http://localhost}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_DATABASE: ${SEED_DATABASE:-false}
    ports:
      - "${API_PORT:-3000}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:8080/health\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  frontend:
    container_name: mobile_vendor_frontend
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    environment:
      PORT: 8080
      API_BACKEND_URL: http://api:8080
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
